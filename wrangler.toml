name = "delivery-pilot-dashboard"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./dist"

[vars]
ENVIRONMENT = "production"
DASHBOARD_TITLE = "Delivery Pilot Dashboard"

# Azure Key Vault configuration integration
# Note: Sensitive tokens are fetched dynamically via Azure Key Vault
AZURE_KEYVAULT_URL = "https://kv-deliverypilot-vault.vault.azure.net/"
